name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  publish:
    runs-on: ubuntu-latest
    needs: [test]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@qsweber"
      - run: npm install
      - name: Set publish version
        run: |
          BASE_VERSION=$(node -e "console.log(require('./package.json').version.replace(/\.\d+$/, ''))")
          npm version "${BASE_VERSION}.${{ github.run_number }}" --no-git-tag-version
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
